<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c25">
<title>Рыбалка</title>
<style>
:root{--bg:#061821;--panel:#0b2631;--line:#1c4855;--mint:#2ee6a0;--gold:#f7c85d;--text:#f3f8f6;--muted:#9bb8bd}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#164454 0,#071b25 46%,#041219 100%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}
.app{max-width:520px;margin:auto;padding:14px 13px 92px}
.top{display:flex;align-items:center;gap:10px;padding:7px 2px 14px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#4e8269,#102d32);border:2px solid #8bcba7;font-size:25px}
.user{flex:1;min-width:0}.name{font-weight:750}
.level{font-size:12px;color:var(--muted);margin-top:2px}
.xp{height:5px;background:#173b45;border-radius:8px;margin-top:6px;overflow:hidden}
.xp span{display:block;height:100%;width:42%;background:linear-gradient(90deg,#10c7a0,#a0f4a7)}
.balance{white-space:nowrap;border:1px solid #41606a;border-radius:13px;padding:9px 11px;background:#0a202b;font-weight:800;color:var(--gold)}
.scene{height:370px;border-radius:22px;overflow:hidden;position:relative;border:1px solid #37616b;background:linear-gradient(#5a9eb4 0%,#b8d9dc 23%,#568e9a 24%,#1d6575 48%,#0a3546 100%);box-shadow:0 15px 40px #0006}
.sun{position:absolute;top:34px;right:45px;width:45px;height:45px;border-radius:50%;background:#ffe5a2;box-shadow:0 0 42px #ffe4a277}
.mountain{position:absolute;left:-8%;right:-8%;top:88px;height:100px;background:#456f68;clip-path:polygon(0 75%,17% 20%,28% 58%,45% 0,61% 56%,76% 22%,100% 80%,100% 100%,0 100%)}
.mountain.back{top:105px;background:#789b8a;opacity:.85;clip-path:polygon(0 70%,18% 5%,35% 64%,55% 12%,72% 59%,88% 15%,100% 60%,100% 100%,0 100%)}
.forest{position:absolute;top:160px;left:0;right:0;height:40px;background:repeating-linear-gradient(110deg,transparent 0 8px,#153f3b 9px 15px,transparent 16px 24px)}
.water{position:absolute;inset:190px 0 0;background:repeating-linear-gradient(176deg,transparent 0 15px,#78c5ca22 16px 18px,transparent 19px 30px),linear-gradient(#236e7d,#082d3c)}
.reflection{position:absolute;left:15%;right:15%;top:200px;height:80px;background:repeating-linear-gradient(180deg,#c2d9bd33 0 2px,transparent 3px 11px);filter:blur(2px)}
.rod{position:absolute;left:14px;bottom:20px;width:195px;height:7px;border-radius:8px;background:linear-gradient(#d8a86a,#53321c);transform:rotate(-29deg);transform-origin:left center;box-shadow:0 2px 3px #0008}
.line{position:absolute;left:175px;top:170px;width:1px;height:110px;background:#e5e7d6aa;transform:rotate(-5deg)}
.bobber{position:absolute;left:165px;top:272px;width:10px;height:25px;border-radius:50% 50% 40% 40%;background:linear-gradient(#ed524c 0 45%,#f8f4dc 46% 100%);box-shadow:0 0 12px #fff7}
.location{position:absolute;top:14px;left:14px;padding:9px 12px;background:#06232dbd;border:1px solid #91c4c266;border-radius:12px;font-weight:700}
.weather{position:absolute;right:14px;bottom:85px;padding:8px 10px;border-radius:10px;background:#08222cb9;font-size:12px}
.cast{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);border:0;border-radius:18px;padding:15px 25px;white-space:nowrap;background:linear-gradient(135deg,#0da979,#27d77f);color:#04291f;font-weight:850;font-size:15px;box-shadow:0 5px 18px #061a1a88}
.cast:active{transform:translateX(-50%) scale(.98)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.stat{background:#0a2530;border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.stat b{display:block;font-size:17px}.stat small{color:var(--muted);font-size:11px}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:17px;font-weight:800}
.card{background:linear-gradient(130deg,#0c2b36,#071d27);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:12px;align-items:center}
.fishicon{width:64px;height:64px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#315d5d,#102e39);font-size:35px}
.cardbody{flex:1}.muted{color:var(--muted);font-size:12px;margin-top:4px}
.price{color:var(--gold);font-weight:800;margin-top:6px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#061821ed;backdrop-filter:blur(16px);border-top:1px solid #24434c;padding:9px max(8px,calc((100vw - 520px)/2)) calc(8px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;max-width:105px;border:0;background:transparent;color:#9cb5b9;font-size:11px;padding:7px 2px;border-radius:12px}
.tab span{display:block;font-size:20px;margin-bottom:3px}.tab.active{background:#0c3a3b;color:#64f0b6}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);transition:.25s;background:#102e38;border:1px solid #3c7378;padding:12px 16px;border-radius:14px;z-index:10;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}.hidden{display:none!important}.page{display:none}.page.active{display:block}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{background:#0a2530
